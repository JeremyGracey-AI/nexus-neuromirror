[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-neuromirror"
version = "0.1.0"
description = "Four-channel Mind Media NeXus-10 + BioTrace+ AI neurofeedback prototype (offline-first, blockwise closed-loop)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeremy Gracey" }]
keywords = ["eeg", "neurofeedback", "nexus-10", "biotrace", "mne", "edf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Conservative, widely-available runtime dependencies.
dependencies = [
    "mne>=1.5,<2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.6",
    "types-PyYAML>=6.0",
    "edfio>=0.4",   # enables EDF export for the synthetic test fixtures
]

[project.scripts]
nexus-neuromirror = "nexus_neuromirror.cli:main"

[project.urls]
Homepage = "https://github.com/JeremyGracey-AI/nexus-neuromirror"
Documentation = "https://github.com/JeremyGracey-AI/nexus-neuromirror/tree/master/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_neuromirror = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

# Third-party packages ship stubs that may target a newer Python than our
# analysis floor; don't follow them into type analysis.
[[tool.mypy.overrides]]
module = ["numpy.*", "matplotlib.*", "mne.*", "yaml.*", "edfio.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
